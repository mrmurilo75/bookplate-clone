<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bookplate{% endblock %}</title>
  {% block head %}{% endblock %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <a class="appbar-logo" href="/"><span class="mark">B</span> Bookplate</a>
      {% if user %}
      <nav class="appbar-nav">
        {% set path = request.url.path %}
        <a href="/" class="{{ 'active' if path == '/' or path.startswith('/books') }}">Library</a>
        <a href="/vocabulary" class="{{ 'active' if path.startswith('/vocabulary') }}">Vocabulary</a>
        <a href="/statistics" class="{{ 'active' if path.startswith('/statistics') }}">Statistics</a>
      </nav>
      <div class="appbar-account">
        <a href="/settings" class="{{ 'active' if path.startswith('/settings') }}">{{ user.name }}</a>
        <form method="post" action="/logout"><button class="link">Sign out</button></form>
      </div>
      {% endif %}
    </div>
  </header>
  <main class="page">{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
