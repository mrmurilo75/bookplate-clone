[project]
name = "bookplate"
version = "1.4.0"
description = "A personal reading tracker with a bold editorial look (Python port of LeoPhh/bookplate)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "markdown-it-py>=3.0",
    "pillow>=10.4",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-bdd>=7", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "tests/features"

[project.scripts]
bookplate-reset-password = "bookplate.cli:reset_password"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bookplate"]
