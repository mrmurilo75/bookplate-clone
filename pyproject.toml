[project]
name = "bookplate"
version = "1.4.0"
description = "A personal reading tracker with a bold editorial look (Python port of LeoPhh/bookplate)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.154",
    "uvicorn[standard]>=0.54",
    "jinja2>=3.1.6",
    "sqlmodel>=0.0.48",
    "alembic>=1.20",
    "python-multipart>=0.0.32",
    "httpx2>=2.15.1",
    "markdown-it-py>=4.2",
    "pillow>=13.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = ["pytest>=9.1", "pytest-bdd>=9.0", "ruff>=0.17"]
docs = ["sphinx>=9.1.1"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "tests/features"

[project.urls]
Documentation = "https://mrmurilo75.github.io/bookplate-clone/"
Source = "https://github.com/mrmurilo75/bookplate-clone"
Original = "https://github.com/LeoPhh/bookplate"

[project.scripts]
bookplate-reset-password = "bookplate.cli:reset_password"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bookplate"]
