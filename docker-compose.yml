# Bookplate — self-hosted reading tracker.
#
#   1. Put this file and .env (copied from .env.example) in a folder.
#   2. Fill in .env — at least DB_PASSWORD and PUBLIC_URL.
#   3. docker compose up -d --build, then open PUBLIC_URL and create your account.

name: bookplate

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  bookplate:
    build: .
    restart: unless-stopped
    logging: *logging
    ports:
      - "${BOOKPLATE_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://bookplate:${DB_PASSWORD:?set DB_PASSWORD in .env}@postgres:5432/bookplate
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      REGISTRATION: ${REGISTRATION:-closed}
      LIMIT_BOOKS: ${LIMIT_BOOKS:-}
      LIMIT_WORDS: ${LIMIT_WORDS:-}
      LIMIT_UPLOAD_MB: ${LIMIT_UPLOAD_MB:-}
      LIMIT_IMPORT_MB: ${LIMIT_IMPORT_MB:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: bookplate
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: bookplate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookplate -d bookplate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  uploads:
  pgdata:
