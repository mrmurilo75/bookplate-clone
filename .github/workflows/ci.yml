name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: bookplate, POSTGRES_PASSWORD: bookplate, POSTGRES_DB: bookplate }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bookplate" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run alembic upgrade head && uv run alembic check
        env: { DATABASE_URL: "sqlite:///./ci.db" }
      - run: uv run pytest
      - run: uv run pytest
        env: { TEST_DATABASE_URL: "postgresql+psycopg://bookplate:bookplate@localhost:5432/bookplate" }
